name: Deploy PWA to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Check urgent deadlines
      - Clean up closed internships
      - Discover new internships
      - Refresh all internships within 10 days
      - Refresh app update display
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
