name: Refresh app update display
on:
  workflow_dispatch:
  schedule:
    - cron: '52 15 * * *'
permissions:
  contents: write
concurrency:
  group: mynavi-data-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/touch_display_refresh.py
      - name: Commit display refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json data/items.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh app update display"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
